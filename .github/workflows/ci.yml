name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      - name: the API panel matches the interfaces
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/index.html

  interop:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # The two implementations this library has to agree with, at the versions
      # it was tested against: age grew the post-quantum recipient in 1.3, and the
      # tagged ones in 1.3.2, which rage has not grown at all.
      - name: install age and rage
        run: |
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz | tar xz -C /tmp
          sudo install /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          curl -fsSL https://github.com/str4d/rage/releases/download/v0.11.1/rage-v0.11.1-x86_64-linux.tar.gz | tar xz -C /tmp
          sudo install /tmp/rage/rage /tmp/rage/rage-keygen /usr/local/bin/
          age --version
          rage --version

      # A tagged recipient is opened by a plugin rather than by age itself, and
      # the only plugin that holds such an identity is the one age's own tests
      # build. It is Go, so this is the one place Go is needed.
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: install the plugin age's tests use for tagged recipients
        run: |
          go install filippo.io/age/tag/internal/age-plugin-tagtest@v1.3.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/age-plugin-tagtest" --help || true

      - name: build the interop example
        run: |
          moon update
          moon build --target native --release src/examples/interop

      - name: exchange files with age and rage
        run: scripts/interop.sh _build/native/release/build/examples/interop/interop.exe
